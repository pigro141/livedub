# Costruisce l'eseguibile e **lo esegue**, che e' il motivo per cui questo file
# esiste.
#
# Sulla macchina di sviluppo Smart App Control e' acceso e in enforcement:
# qualunque `.exe` appena compilato viene rifiutato con `Permission denied` —
# provato anche con un `ciao.py` di una riga. Li' il pacchetto non e' eseguibile
# nemmeno una volta, quindi pubblicarlo vorrebbe dire consegnare un file che
# **nessuno ha mai aperto**. Sui runner `windows-latest` quel criterio non c'e':
# e' l'unico posto dove si puo' rispondere alla domanda «parte?».
#
# **E «parte» non e' «il file esiste».** Un pacchetto sbagliato si apre, mostra
# la finestra giusta e non sa ne' leggere ne' parlare: e' successo davvero il 20
# agosto, quando quattro delle cinque librerie che portano dati non ne avevano
# nemmeno uno, fra cui i due motori *di serie*. Quindi qui l'eseguibile viene
# lanciato con `--autoprova`, che dentro il pacchetto legge una riga disegnata,
# sintetizza una battuta e costruisce la finestra, e scrive un rapporto JSON.
#
# Cosa questo controllo **non** puo' dire sta scritto in fondo al file.

name: eseguibile

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  costruisci-e-prova:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      # La versione conta: le ruote di `onnxruntime-gpu` e `PyAudioWPatch` usate
      # qui sono per 3.11, e su 3.12 pip ricompila o non trova niente — con il
      # guasto che arriva molto piu' tardi, sotto forma di import che fallisce.
      - name: Python 3.11.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-nodeps.txt

      # **Due comandi e non uno, e il secondo non e' un optional.** I quattro
      # pacchetti di `requirements-nodeps.txt` chiedono tutti `onnxruntime` (la
      # ruota CPU), che accanto a `onnxruntime-gpu` spegne la CUDA in silenzio:
      # `--no-deps` e' un'opzione globale e per questo stanno in un file a se'.
      # Il perche' con la misura sta in quel file.
      - name: Le dipendenze, come le installa chi scarica il programma
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-nodeps.txt --no-deps
          python -m pip install pyinstaller==6.21.0

      # La stessa domanda che `installa.ps1` fa subito dopo aver installato: se
      # la ruota CPU si e' intrufolata lo stesso, **nessun errore lo direbbe** —
      # la sintesi diventa tre volte piu' lenta e basta.
      - name: Un solo onnxruntime
        shell: pwsh
        run: |
          $nomi = python -c "import importlib.metadata as md; print(' '.join(sorted((d.metadata['Name'] or '').lower() for d in md.distributions() if d.metadata['Name'])))"
          if ($nomi -split ' ' -contains 'onnxruntime') {
            throw "c'e' anche la ruota CPU accanto a onnxruntime-gpu: la CUDA sarebbe spenta in silenzio"
          }
          "solo il pacchetto GPU, com'e' giusto"

      # **La suite qui dice un numero che sulla macchina di sviluppo non si puo'
      # leggere.** Li' dodici verifiche cadono per Smart App Control (opencv,
      # torch/shm.dll e con loro argostranslate), e il criterio e' «non
      # aggiungerne». Su un runner senza quel criterio si vede quante ne cadono
      # **davvero**. Non blocca l'artefatto: quello lo decide l'autoprova.
      - name: La suite, su una macchina senza Smart App Control
        continue-on-error: true
        run: python -m tools.selftest

      - name: Costruisci il pacchetto
        run: python -m PyInstaller --noconfirm livedub.spec

      - name: Cosa e' venuto su
        shell: pwsh
        run: |
          $dist = 'dist\livedub'
          $mb = [math]::Round((Get-ChildItem $dist -Recurse -File | Measure-Object Length -Sum).Sum / 1MB, 1)
          "pacchetto: $mb MB"
          Get-ChildItem $dist | Select-Object Mode, Length, Name | Format-Table
          if (-not (Test-Path "$dist\livedub.exe")) { throw "non c'e' nessun livedub.exe" }
          # I dati che il difetto del 20 agosto aveva lasciato a casa. Qui si
          # guarda solo che ci siano: che **servano** lo dice l'autoprova, che li
          # usa invece di contarli.
          foreach ($atteso in @(
              "$dist\_internal\profiles\gtav.json",
              "$dist\_internal\core\config.py",
              "$dist\_internal\assets\logo\livedub.png",
              "$dist\_internal\LICENSE",
              "$dist\_internal\LICENZE.md")) {
            if (-not (Test-Path $atteso)) { throw "manca dal pacchetto: $atteso" }
          }
          $cataloghi = (Get-ChildItem "$dist\_internal\ui\lingue" -Filter *.json).Count
          "cataloghi della lingua: $cataloghi"
          if ($cataloghi -lt 41) { throw "solo $cataloghi cataloghi: la finestra sarebbe quasi solo in italiano" }
          # `ultima.json` non e' un profilo: e' la configurazione con cui si e'
          # chiuso l'ultimo avvio di chi ha compilato. Nel pacchetto del 20
          # agosto c'era, e l'eseguibile partiva con la ROI dello schermo di un
          # altro senza dare errore.
          if (Test-Path "$dist\_internal\profiles\ultima.json") {
            throw "nel pacchetto c'e' ultima.json: la sessione di chi ha compilato"
          }

      # **`Start-Process -Wait`, e non una chiamata normale.** L'eseguibile e'
      # costruito con `console=False`: lanciato dalla shell torna subito e la
      # shell non aspetta niente, quindi un `livedub.exe --autoprova` scritto
      # come un comando qualunque direbbe «riuscito» prima ancora che il
      # programma abbia aperto un file.
      - name: L'eseguibile parte, e si prova da dentro
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist\livedub\livedub.exe'
          $rapporto = Join-Path $PWD 'rapporto-1.json'
          $p = Start-Process -FilePath $exe -ArgumentList '--autoprova', $rapporto `
                             -Wait -PassThru -NoNewWindow
          "codice di uscita: $($p.ExitCode)"
          if (-not (Test-Path $rapporto)) {
            throw "nessun rapporto: l'eseguibile non e' arrivato a scrivere un file"
          }
          Get-Content $rapporto -Raw | Write-Host
          if ($p.ExitCode -ne 0) { throw "l'autoprova ha trovato qualcosa di rotto" }

      # **La stessa prova da un'altra cartella.** `models/` deve stare accanto
      # all'eseguibile e non dipendere da dove lo si lancia: se dipendesse,
      # aprirlo da un collegamento vorrebbe dire riscaricare mezzo giga a ogni
      # avvio, senza un errore e senza capire perche'. La regola sta in
      # `core/percorsi.py`, e questa e' la dimostrazione.
      - name: E parte anche da un'altra cartella, cercando i modelli nello stesso posto
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist\livedub\livedub.exe'
          $altrove = Join-Path $env:RUNNER_TEMP 'altrove'
          New-Item -ItemType Directory -Force $altrove | Out-Null
          $rapporto = Join-Path $altrove 'rapporto-2.json'
          $p = Start-Process -FilePath $exe -ArgumentList '--autoprova', $rapporto `
                             -Wait -PassThru -NoNewWindow -WorkingDirectory $altrove
          if ($p.ExitCode -ne 0) { throw "dall'altra cartella l'autoprova non passa" }
          $uno = Get-Content (Join-Path $PWD 'rapporto-1.json') -Raw | ConvertFrom-Json
          $due = Get-Content $rapporto -Raw | ConvertFrom-Json
          "modelli, primo giro:  $($uno.modelli)"
          "modelli, secondo giro: $($due.modelli)"
          "lanciato da: $($uno.cartella_di_lancio)  e  $($due.cartella_di_lancio)"
          if ($uno.cartella_di_lancio -eq $due.cartella_di_lancio) {
            throw "i due giri sono partiti dalla stessa cartella: la prova non puo' esprimere la risposta"
          }
          if ($uno.modelli -ne $due.modelli) {
            throw "i modelli cambiano posto con la cartella di lancio: si riscaricherebbero"
          }
          if ($due.modelli -like '*_internal*') {
            throw "i modelli finiscono in _internal, dove stanno i .py e non la roba dell'utente"
          }
          if (Test-Path (Join-Path $altrove 'models')) {
            throw "e' nata una seconda cartella models\ nella cartella di lancio"
          }
          if (-not (Test-Path 'dist\livedub\models')) {
            throw "models\ non e' accanto all'eseguibile"
          }
          $mb = [math]::Round((Get-ChildItem 'dist\livedub\models' -Recurse -File | Measure-Object Length -Sum).Sum / 1MB, 1)
          "models\ accanto all'eseguibile: $mb MB, scaricati al primo avvio"

      # **Nessuna prova saltata puo' passare per riuscita.** Una prova che non si
      # e' fatta e' `saltata`, non `ok`: darle la spunta verde sarebbe il ripiego
      # silenzioso girato dall'altra parte. Qui si pretende che siano tutte fatte.
      - name: Nessuna prova saltata, nessuna rotta
        shell: pwsh
        run: |
          $r = Get-Content 'rapporto-1.json' -Raw | ConvertFrom-Json
          foreach ($p in $r.prove) { "{0,-8} {1,-22} {2}" -f $p.esito, $p.prova, $p.nota }
          if (-not $r.congelato) { throw "il rapporto non viene da un eseguibile" }
          $saltate = @($r.prove | Where-Object { $_.esito -ne 'ok' })
          if ($saltate.Count -gt 0) {
            throw "prove non riuscite o saltate: $(($saltate | ForEach-Object { $_.prova }) -join ', ')"
          }
          "$($r.prove.Count) prove, tutte fatte e tutte passate"

      # **I modelli scaricati dalla prova non salgono nell'artefatto**, ed e' una
      # scelta di licenza prima che di dimensione: sta scritta in `LICENZE.md` e
      # regge tutto `livedub.spec`. I pesi di Piper, Kokoro ed ECAPA hanno ognuno
      # la propria licenza, e OneOCR e' di Microsoft e **non e' ridistribuibile**.
      # Un pacchetto che se li portasse dietro si assumerebbe licenze che nessuno
      # ha letto. Sono serviti a provare che l'eseguibile sa scaricarli e usarli;
      # finito quello, se ne vanno.
      - name: I modelli restano qui, non nell'artefatto
        shell: pwsh
        run: |
          if (Test-Path 'dist\livedub\models') {
            Remove-Item 'dist\livedub\models' -Recurse -Force
            "tolti: l'eseguibile se li riscarica al primo avvio, com'e' scritto in LICENZE.md"
          }

      - name: Il rapporto e il registro del banco
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapporto-autoprova
          path: |
            rapporto-1.json
            ${{ runner.temp }}/altrove/rapporto-2.json
          if-no-files-found: warn

      # L'artefatto si pubblica **solo se le prove sono passate**: un pacchetto
      # scaricabile che nessuno ha aperto e' esattamente la cosa che questo
      # workflow esiste per non fare. E nessuna release: quella la decide
      # l'utente.
      - name: L'eseguibile provato
        uses: actions/upload-artifact@v4
        with:
          name: livedub-windows
          path: dist/livedub
          retention-days: 14

# ============================================================================
# Cosa questo controllo **non** dice, ed e' la meta' che conta
#
# Un runner non ha una scheda audio, non ha una scheda video e non ha un gioco
# aperto. Quindi qui e' provato che il pacchetto **parte, ha i suoi dati e sa
# leggere, parlare e disegnare la finestra**; non e' provato niente della catena
# dal vivo. In particolare restano senza prova:
#
#  - la **cattura**, che sia WGC o `PrintWindow`: serve una finestra di gioco
#    vera, e su un gioco Direct3D `PrintWindow` puo' riuscire e restituire nero;
#  - il **loopback audio** e il mixaggio: `PyAudioWPatch` non ha nessun
#    dispositivo da aprire su un runner;
#  - la **GPU**: nessun provider CUDA, quindi Kokoro non e' misurabile qui e
#    tutto quello che riguarda `tts.device=cuda` resta indietro;
#  - **Smart App Control**, che e' il difetto per cui questo file esiste: sui
#    runner e' spento, quindi «parte qui» non vuol dire «parte su una Windows 11
#    appena installata». Quel confine si sposta solo con una firma.
# ============================================================================
