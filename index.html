<title>livedub — live dubbing for game subtitles</title>
<meta name="description" content="livedub reads a game's on-screen subtitles while you play, works out who is speaking from the audio, synthesises the line with that character's voice and mixes it over the game. All on your own machine, on Windows.">

<!-- Il tema scelto si applica **prima** che la pagina venga dipinta: leggerlo
     dopo vorrebbe dire un lampo bianco su chi ha scelto lo scuro. -->
<script>
try{var t=localStorage.getItem("livedub.theme");
    if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}
</script>
